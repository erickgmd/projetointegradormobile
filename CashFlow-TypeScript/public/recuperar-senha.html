<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183350">
<title>Recuperar senha — CashFlow</title>
<link rel="stylesheet" href="/accessibility.css">
<link rel="stylesheet" href="/auth.css">
<script src="/mobile.js"></script>
<script src="/auth-ui.js"></script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-brand"><img class="auth-logo brand-logo" src="/logo-cashflow.png" alt="" aria-hidden="true"><span>Cash Flow</span></div>
  <main class="auth-card">
    <section id="pedido">
      <div class="auth-icon" aria-hidden="true">🔑</div>
      <h1>Esqueceu a senha?</h1>
      <p class="auth-lead">Informe o email da sua conta. Vamos enviar um link para você criar uma nova senha.</p>
      <div class="form-alert" id="status" role="status" aria-live="polite"></div>
      <form class="auth-form" novalidate>
        <label for="email">E-mail cadastrado</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com" required>
        <p class="field-error" id="emailErro" hidden></p>
        <button class="auth-submit" type="submit">Enviar link de recuperação</button>
      </form>
    </section>
    <section id="enviado" class="auth-done" hidden>
      <div class="auth-icon" aria-hidden="true">📩</div>
      <h1>Confira seu email</h1>
      <p class="auth-lead" id="enviadoTexto"></p>
      <p class="auth-lead">O link vale por 15 minutos e só pode ser usado uma vez. Não recebeu? Verifique o spam ou <a href="#" id="reenviar">tente de novo</a>.</p>
    </section>
    <p class="auth-links"><a href="/CashFlow_Tela_de_Login/login.html">← Voltar ao login</a></p>
  </main>
</div>
<script>
(function () {
  var form = document.querySelector("form");
  var email = document.getElementById("email");
  var erro = document.getElementById("emailErro");
  var status = document.getElementById("status");
  try { email.value = localStorage.getItem("cashflow-remember-email") || ""; } catch (e) {}
  function alerta(tipo, texto) { status.className = "form-alert show " + tipo; status.textContent = texto; }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    erro.hidden = true; email.classList.remove("input-invalid"); status.className = "form-alert";
    var valor = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor)) {
      erro.textContent = "Digite um email válido, por exemplo nome@gmail.com.";
      erro.hidden = false; email.classList.add("input-invalid"); email.focus(); return;
    }
    var botao = form.querySelector("button"); botao.disabled = true; botao.textContent = "Enviando...";
    try {
      var r = await fetch("/api/senha/recuperar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: valor }) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) { alerta("error", d.message || "Não foi possível enviar agora. Tente novamente."); return; }
      document.getElementById("enviadoTexto").textContent = "Se existir uma conta com " + valor + ", você vai receber em instantes um email com o link para criar uma nova senha.";
      document.getElementById("pedido").hidden = true;
      document.getElementById("enviado").hidden = false;
    } catch (err) {
      alerta("error", "Sem conexão com o servidor. Verifique sua internet e tente novamente.");
    } finally { botao.disabled = false; botao.textContent = "Enviar link de recuperação"; }
  });
  document.getElementById("reenviar").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("enviado").hidden = true;
    document.getElementById("pedido").hidden = false;
    email.focus();
  });
})();
</script>
</body>
</html>
