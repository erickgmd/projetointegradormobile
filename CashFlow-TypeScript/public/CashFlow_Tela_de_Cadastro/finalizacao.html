<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finalização do Cadastro - CashFlow</title>
  <link rel="stylesheet" href="finalizacao.css"/>
<link rel="stylesheet" href="/accessibility.css">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/mobile.css">
<script src="/mobile.js"></script>
<script src="/money-mask.js"></script>
<script src="/requirements.js" defer></script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Finalização do Cadastro</h1>
      <p>Última etapa: informe seus dados financeiros para completar o cadastro.</p>
    </div>

    <div class="progress-bar">
      <div class="step completed"><div class="step-number">✓</div><div class="step-label">Dados Pessoais</div></div>
      <div class="step-connector active"></div>
      <div class="step completed"><div class="step-number">✓</div><div class="step-label">Endereço</div></div>
      <div class="step-connector active"></div>
      <div class="step active"><div class="step-number">3</div><div class="step-label">Finalização</div></div>
    </div>

    <div class="form-container">
      <div class="form-alert" id="finalAlerta" role="alert"></div>
      <p>Questionário financeiro opcional. Você pode finalizar sem informar estes dados.</p><form id="formFinanceiro" autocomplete="off" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="renda">Renda Mensal (opcional)</label>
            <input type="text" id="renda" name="renda" placeholder="Ex.: R$ 3.500,00" inputmode="decimal">
          </div>
          <div class="form-group">
            <label for="despesas">Média de Despesas Mensal (opcional)</label>
            <input type="text" id="despesas" name="despesas" placeholder="Ex.: R$ 2.100,00" inputmode="decimal">
          </div>
        </div>

        <div class="checkbox-container idade-container">
          <input type="checkbox" id="menor_18" name="menor_18" value="true">
          <label for="menor_18">Menor de 18 anos (opcional — se você informou a data de nascimento, calculamos sozinhos)</label>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tipo_investimento">Tipo de Investimento (opcional)</label>
            <select id="tipo_investimento" name="tipo_investimento">
              <option value="">Selecione</option>
              <option value="conservador">Conservador</option>
              <option value="moderado">Moderado</option>
              <option value="arrojado">Arrojado</option>
              <option value="agressivo">Agressivo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="faixa_investimento">Faixa de Investimento (opcional)</label>
            <select id="faixa_investimento" name="faixa_investimento">
              <option value="">Selecione</option>
              <option value="ate-1000">Até R$ 1.000</option>
              <option value="1000-5000">R$ 1.000 - R$ 5.000</option>
              <option value="5000-10000">R$ 5.000 - R$ 10.000</option>
              <option value="10000-50000">R$ 10.000 - R$ 50.000</option>
              <option value="acima-50000">Acima de R$ 50.000</option>
            </select>
          </div>
        </div>

        <div class="form-buttons">
          <button type="button" class="btn-secondary" id="voltarBtn">Passo Anterior</button>
          <button type="button" id="skipFinance" class="btn-secondary">Pular e finalizar cadastro</button><button type="button" class="btn-finalizar" id="finalizarBtn">Finalizar Cadastro</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    const form = document.getElementById("formFinanceiro");
    const voltarBtn = document.getElementById("voltarBtn");
    const finalizarBtn = document.getElementById("finalizarBtn");
    const rendaInput = document.getElementById("renda");
    const despesasInput = document.getElementById("despesas");
    const alerta = document.getElementById("finalAlerta");

    function mostrarAlerta(tipo, texto) {
      alerta.className = "form-alert show " + tipo;
      alerta.textContent = texto;
      alerta.scrollIntoView?.({ behavior: "smooth", block: "center" });
    }

    // Só entra aqui quem já criou a conta; com data de nascimento, a caixa de idade some.
    fetch("/api/perfil", { credentials: "include" })
      .then((r) => {
        if (r.status === 401) {
          window.location.replace("/CashFlow_Tela_de_Cadastro/dadospessoais.html");
          return null;
        }
        return r.ok ? r.json() : null;
      })
      .then((r) => {
        if (r?.dados?.nascimento)
          document.querySelector(".idade-container").hidden = true;
      })
      .catch(() => {});

    // Máscara em reais com limite de R$ 10 bilhões (money-mask.js).
    window.CashFlowMoney?.aplicar(rendaInput, { max: 9999999999.99, mensagemMax: "A renda mensal pode ser de no máximo R$ 10 bilhões." });
    window.CashFlowMoney?.aplicar(despesasInput, { max: 9999999999.99, mensagemMax: "A média de despesas pode ser de no máximo R$ 10 bilhões." });

    function brToDecimal(str) {
      if (!str) return "";
      return str.toString()
        .replace(/[^0-9,.-]/g, "")
        .replace(/\./g, "")
        .replace(",", ".");
    }

    form.addEventListener("submit", (e) => e.preventDefault());

    voltarBtn.addEventListener("click", () => {
      window.location.href = "endereco.html";
    });

    document.getElementById("skipFinance").addEventListener("click", () => {
      form.reset();
      for (const control of form.querySelectorAll("input,select")) { if (control.type === "checkbox") control.checked = false; else control.value = ""; }
      finalizarBtn.click();
    });
    finalizarBtn.addEventListener("click", async () => {
      const fd = new FormData(form);
      fd.set("menor_18", document.getElementById("menor_18").checked ? "true" : "false");
      fd.set("renda", brToDecimal(rendaInput.value.trim()));
      fd.set("despesas", brToDecimal(despesasInput.value.trim()));

      finalizarBtn.disabled = true;
      finalizarBtn.textContent = "Finalizando...";

      try {
        const resp = await fetch("/api/cadastro/etapa3", { method: "POST", body: fd, credentials: "include" });
        const text = await resp.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { status: "error", message: "Resposta inválida do servidor." }; }
        if (data.status === "success") {
          mostrarAlerta("success", "🎉 Cadastro concluído! Abrindo o CashFlow...");
          setTimeout(() => window.location.assign("/CashFlow_Tela_HomePage/home.html"), 900);
          return;
        }
        mostrarAlerta("error", data.message || "Não foi possível salvar. Tente novamente.");
      } catch (e) {
        mostrarAlerta("error", "Sem conexão com o servidor. Tente novamente.");
      }
      finalizarBtn.disabled = false;
      finalizarBtn.textContent = "Finalizar Cadastro";
    });
  })();
  </script>
</body>
</html>
