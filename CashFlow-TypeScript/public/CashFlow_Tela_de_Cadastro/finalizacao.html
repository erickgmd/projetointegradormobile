<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finalização do Cadastro - Cash Flow</title>
  <link rel="stylesheet" href="finalizacao.css"/>
<link rel="stylesheet" href="/accessibility.css">
<link rel="stylesheet" href="/mobile.css">
<script src="/mobile.js"></script>
<script src="/requirements.js" defer></script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Finalização do Cadastro</h1>
      <p>Última etapa: informe seus dados financeiros para completar o cadastro.</p>
    </div>

    <div class="progress-bar">
      <div class="step completed"><div class="step-number">✓</div><div class="step-label">Dados Pessoais</div></div>
      <div class="step-connector active"></div>
      <div class="step completed"><div class="step-number">✓</div><div class="step-label">Endereço</div></div>
      <div class="step-connector active"></div>
      <div class="step active"><div class="step-number">3</div><div class="step-label">Financeiro</div></div>
    </div>

    <div class="form-container">
      <p>Questionário financeiro opcional. Você pode finalizar sem informar estes dados.</p><form id="formFinanceiro" autocomplete="off" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="renda">Renda Mensal (opcional)</label>
            <input type="text" id="renda" name="renda" placeholder="Ex.: R$ 3.500,00">
          </div>
          <div class="form-group">
            <label for="despesas">Média de Despesas Mensal (opcional)</label>
            <input type="text" id="despesas" name="despesas" placeholder="Ex.: R$ 2.100,00">
          </div>
        </div>

        <div class="checkbox-container idade-container">
          <input type="checkbox" id="menor_18" name="menor_18" value="true">
          <label for="menor_18">Menor de 18 anos (opcional)</label>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tipo_investimento">Tipo de Investimento (opcional)</label>
            <select id="tipo_investimento" name="tipo_investimento">
              <option value="">Selecione</option>
              <option value="conservador">Conservador</option>
              <option value="moderado">Moderado</option>
              <option value="arrojado">Arrojado</option>
              <option value="agressivo">Agressivo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="faixa_investimento">Faixa de Investimento (opcional)</label>
            <select id="faixa_investimento" name="faixa_investimento">
              <option value="">Selecione</option>
              <option value="ate-1000">Até R$ 1.000</option>
              <option value="1000-5000">R$ 1.000 - R$ 5.000</option>
              <option value="5000-10000">R$ 5.000 - R$ 10.000</option>
              <option value="10000-50000">R$ 10.000 - R$ 50.000</option>
              <option value="acima-50000">Acima de R$ 50.000</option>
            </select>
          </div>
        </div>

        <div class="form-buttons">
          <button type="button" class="btn-secondary" id="voltarBtn">Passo Anterior</button>
          <button type="button" id="skipFinance" class="btn-secondary">Pular e finalizar cadastro</button><button type="button" class="btn-finalizar" id="finalizarBtn">Finalizar Cadastro</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    console.log("🔥 JS inline da etapa 3 carregado");

    const form = document.getElementById("formFinanceiro");
    const voltarBtn = document.getElementById("voltarBtn");
    const finalizarBtn = document.getElementById("finalizarBtn");
    const rendaInput = document.getElementById("renda");
    const despesasInput = document.getElementById("despesas");

    function maskMoney(el) {
      el.addEventListener("input", () => {
        let v = el.value.replace(/\D/g, "");
        if (!v) { el.value = ""; return; }
        v = (parseInt(v, 10) / 100).toFixed(2);
        v = v.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        el.value = "R$ " + v;
      });
    }
    maskMoney(rendaInput);
    maskMoney(despesasInput);

    function brToDecimal(str) {
      if (!str) return "";
      return str.toString()
        .replace(/[^0-9,.-]/g, "")
        .replace(/\./g, "")
        .replace(",", ".");
    }

    form.addEventListener("submit", (e) => e.preventDefault());

    voltarBtn.addEventListener("click", () => {
      window.location.href = "endereco.html";
    });

    document.getElementById('skipFinance').addEventListener('click', () => {
      form.reset();
      for (const control of form.querySelectorAll('input,select')) { if (control.type === 'checkbox') control.checked = false; else control.value = ''; }
      finalizarBtn.click();
    });
    finalizarBtn.addEventListener("click", async () => {
      const renda = rendaInput.value.trim();
      const despesas = despesasInput.value.trim();
      const tipoInv = document.getElementById("tipo_investimento").value.trim();
      const faixaInv = document.getElementById("faixa_investimento").value.trim();



      const fd = new FormData(form);

      // 🔥 CORREÇÃO DO BOOLEAN
      const menor18 = document.getElementById("menor_18").checked;
      fd.set("menor_18", menor18 ? "true" : "false");

      fd.set("renda", brToDecimal(renda));
      fd.set("despesas", brToDecimal(despesas));

      finalizarBtn.disabled = true;
      finalizarBtn.textContent = "Finalizando...";

      try {
        const resp = await fetch("/api/cadastro/etapa3", {
          method: "POST",
          body: fd
        });

        const text = await resp.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { status: "error", message: text || "Resposta inválida do servidor." }; }

        console.log("📡 Resposta:", data);

        if (data.status === "success") {
          alert("🎉 " + data.message);
          window.location.href = "../CashFlow_Tela_de_Login/login.html";
        } else {
          alert("❌ " + (data.message || "Falha ao salvar."));
        }
      } catch (e) {
        console.error(e);
        alert("⚠️ Erro no servidor. Tente novamente.");
      } finally {
        finalizarBtn.disabled = false;
        finalizarBtn.textContent = "Finalizar Cadastro";
      }
    });
  })();
  </script>
</body>
</html>
