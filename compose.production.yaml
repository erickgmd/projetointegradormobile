# Use sobre compose.yaml: requer domínio e SMTP/Telegram em .env.
services:
  app:
    restart: unless-stopped
    ports: !reset []
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      APP_ORIGIN: https://${CASHFLOW_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  db:
    restart: unless-stopped
    ports: !reset []
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CASHFLOW_DOMAIN: ${CASHFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
