<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashFlow - sem conexão</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6f8; color: #1f2933; }
    main { max-width: 360px; padding: 24px; text-align: center; }
    h1 { font-size: 1.4rem; }
    button { margin-top: 16px; padding: 12px 24px; font-size: 1rem; border: 0; border-radius: 8px; background: #1b7f5a; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Não foi possível conectar</h1>
    <p>O servidor do CashFlow não respondeu. Verifique sua conexão com a internet e tente novamente.</p>
    <button type="button" onclick="history.back(); setTimeout(function () { location.reload(); }, 300);">Tentar novamente</button>
  </main>
</body>
</html>
