<!-- Cole este bloco dentro da tela de perfil, no local onde deseja configurar o limite -->
<section class="profile-limit-card" id="gasto-maximo">
    <div class="profile-limit-header">
        <div>
            <span>Controle financeiro</span>
            <h2>Gasto máximo mensal</h2>
            <p>Defina o valor máximo que deseja gastar por mês. O sino da tela inicial avisará quando você estiver perto ou ultrapassar o limite.</p>
        </div>
        <div class="profile-limit-icon">🔔</div>
    </div>

    <form id="gastoMaximoForm" class="profile-limit-form">
        <label for="gastoMaximoInput">Valor máximo mensal</label>
        <div class="profile-limit-input-row">
            <span>R$</span>
            <input type="number" id="gastoMaximoInput" step="0.01" min="0" placeholder="Ex: 2500.00">
        </div>

        <button type="submit">Salvar gasto máximo</button>
    </form>

    <p id="gastoMaximoMensagem" class="profile-limit-message"></p>
</section>

<link rel="stylesheet" href="../CashFlow_Tela_HomePage/perfil_gasto_maximo.css">
<script src="../CashFlow_Tela_HomePage/perfil_gasto_maximo.js"></script>
